name: ci

on:
  push:
    branches: [master]
  pull_request:
  # Run workflow (Actions tab): the same checks plus the end-to-end job.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
        # The pinned SDK goes to a directory of its own. In the runner's /usr/share/dotnet it would share the workload
        # manifests of the newer preinstalled SDK of the same band, which change a pack version the lock files hold.
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet

      # Design 6.7: the lock files (packages.lock.json) fix every package version, so a restore that would change one fails.
      - name: Restore
        run: dotnet restore LT2.sln --locked-mode

      # Warnings are errors (Directory.Build.props), including NuGet audit warnings for known vulnerabilities.
      - name: Build
        run: dotnet build LT2.sln --configuration Release --no-restore

      - name: NuGet audit (direct and transitive packages)
        run: |
          dotnet list LT2.sln package --vulnerable --include-transitive | tee audit.txt
          if grep -qi "has the following vulnerable packages" audit.txt; then
            echo "::error::Vulnerable NuGet packages found"
            exit 1
          fi

      # Unit, architecture and integration tests. Integration tests start PostgreSQL with Testcontainers on the
      # runner's Docker. The end-to-end tests are skipped here (no LT2_E2E_BASE_URL); the e2e job runs them when the
      # workflow is started by hand.
      - name: Test
        run: dotnet test --solution LT2.sln --configuration Release --no-build

  e2e:
    name: End to end (compose stack, Playwright)
    runs-on: ubuntu-24.04
    needs: build-and-test
    # The end-to-end suite is not a merge gate (AGENTS.md): it runs only when started by hand.
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      COMPOSE_ENV_FILES: ${{ github.workspace }}/deploy/.env,${{ github.workspace }}/deploy/standin.env
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
        # The pinned SDK goes to a directory of its own. In the runner's /usr/share/dotnet it would share the workload
        # manifests of the newer preinstalled SDK of the same band, which change a pack version the lock files hold.
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet

      - name: Start the stack
        run: |
          python3 deploy/init-secrets.py
          docker compose -f deploy/compose.yaml up --build --detach
          for i in $(seq 1 60); do
            if curl -fsk --resolve lt2.localhost:8443:127.0.0.1 https://lt2.localhost:8443/health/ready; then exit 0; fi
            sleep 3
          done
          docker compose -f deploy/compose.yaml logs
          exit 1

      - name: Install Playwright Chromium
        run: |
          dotnet build tests/Lt2.E2E --configuration Release
          pwsh tests/Lt2.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: End-to-end tests
        env:
          LT2_E2E_BASE_URL: https://lt2.localhost:8443
          LT2_E2E_MAILPIT_URL: http://localhost:8025
          LT2_E2E_HTTP_URL: http://lt2.localhost:8080
        run: dotnet test --project tests/Lt2.E2E --configuration Release --no-build

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-screenshots
          path: tests/Lt2.E2E/bin/Release/net10.0/output/
          if-no-files-found: ignore

      # The last lines of each service only: the whole log buries the test results above it past what a log reader shows.
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yaml logs --tail 150
