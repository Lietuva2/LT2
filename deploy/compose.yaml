# Lietuva 2.0: local and production-shaped stack (design 9.1).
#
#   python deploy/init-secrets.py       # once
#   docker compose -f deploy/compose.yaml up --build
#
# Local defaults come from deploy/.env (site https://lt2.localhost:8443, Mailpit on http://localhost:8025, the
# "local" profile with Mailpit and the Seimas stand-in, a trial invitation code). Production sets its own values:
# LT2_SITE_ADDRESS (the domain), LT2_TLS (the ACME contact address), ports 80/443, COMPOSE_PROFILES empty (no Mailpit,
# no stand-in), real SMTP settings, LT2_SEIMAS_BASE_ADDRESS and LT2_OUTBOUND_EXTRA_HOST empty (the worker then
# imports from https://apps.lrs.lt/sip/).
# Secrets are files in deploy/secrets/ (LT2_SECRETS_DIR elsewhere), mounted under /run/secrets and never committed
# (design 6.5). LT2_IMAGE_TAG names the images' tag ("local" by default; a server tags them with the deployed commit).
# Behind a server's existing Caddy, add compose.shared-proxy.yaml (README.md).
# Database connections use passwords, never Kerberos: "GSS Encryption Mode=Disable" stops Npgsql looking for
# libgssapi_krb5, which the chiselled images do not have (it logged an error at every start).

name: lt2

x-dotnet-hardening: &dotnet-hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    # Caddy listens on the published ports themselves (http_port in the Caddyfile, the HTTPS port in its site address), so
    # its redirects are right.
    ports:
      - "${LT2_HTTP_PORT:-8080}:${LT2_HTTP_PORT:-8080}"
      - "${LT2_HTTPS_PORT:-8443}:${LT2_HTTPS_PORT:-8443}"
      - "${LT2_HTTPS_PORT:-8443}:${LT2_HTTPS_PORT:-8443}/udp"
    environment:
      LT2_SITE_ADDRESS: ${LT2_SITE_ADDRESS:-lt2.localhost}
      LT2_TLS: ${LT2_TLS:-internal}
      LT2_HTTP_PORT: ${LT2_HTTP_PORT:-8080}
      LT2_HTTPS_PORT: ${LT2_HTTPS_PORT:-8443}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    depends_on:
      - web
    networks: [edge]

  web:
    <<: *dotnet-hardening
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    image: lt2/web:${LT2_IMAGE_TAG:-local}
    environment:
      ConnectionStrings__Lt2: Host=postgres;Port=5432;Database=lt2;Username=lt2_app;GSS Encryption Mode=Disable
      # Design 6.8: X-Forwarded-For and -Proto are believed only from this proxy (LT2's own Caddy, by its service name on
      # the edge network); compose.shared-proxy.yaml names the server's Caddy instead.
      ReverseProxy__Address: caddy
      # The site's own address, the one Caddy serves: links in emails and in the summary's text start with it (design 5.6).
      Site__Address: https://${LT2_SITE_ADDRESS:-lt2.localhost}:${LT2_HTTPS_PORT:-8443}
      # Where visitors without a session may write to the moderators (design 8.3). Production sets the real address.
      Moderation__ContactAddress: ${LT2_MODERATION_CONTACT:-}
      # The repository's GitHub issues, linked from the feedback panel (design 8.10); nothing shown when empty.
      Feedback__IssuesUrl: ${LT2_FEEDBACK_ISSUES_URL:-}
      # Requests per client address in each window (design 6.4). The defaults here are the code's; only the local .env
      # raises them, so hand testing and end-to-end runs on one machine never meet a 429.
      RateLimits__CodeRequest__PermitLimit: ${LT2_RATE_CODE_REQUESTS:-10}
      RateLimits__Registration__PermitLimit: ${LT2_RATE_REGISTRATIONS:-20}
      RateLimits__SignIn__PermitLimit: ${LT2_RATE_SIGN_INS:-30}
      # The MP's link (design 8.19.7): its pages and token routes per client address; only the local .env raises it.
      RateLimits__MpMail__PermitLimit: ${LT2_RATE_MP_MAIL:-60}
      # Design 8.19.1: where the data is invented (Demo:Allowed), MP mail goes only when the deployment declares all its mail
      # caught (Email:Caught: true only where Mailpit takes every email, the local .env). Both false by default.
      Demo__Allowed: ${LT2_DEMO_DATA:-false}
      Email__Caught: ${LT2_MAIL_CAUGHT:-false}
      # The AI draft of an appeal's description (design 8.11.4): "claude" with a key in deploy/secrets/ai_api_key turns it
      # on; empty (the default) keeps it off and nothing offers a draft. Its host is then the only one the web may call.
      Ai__Provider: ${LT2_AI_PROVIDER:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    secrets:
      - source: db_app_password
        target: Database__Password
      - source: ai_api_key
        target: Ai__ApiKey
      - source: data_protection_key
        target: DataProtection__KeyEncryptionKey
      - source: ip_hash_key
        target: Security__IpHashKey
      - source: mail_hash_key
        target: Security__MailHashKey
      - source: device_hash_key
        target: Security__DeviceHashKey
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks: [edge, backend]

  worker:
    <<: *dotnet-hardening
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: worker
    image: lt2/worker:${LT2_IMAGE_TAG:-local}
    environment:
      ConnectionStrings__Lt2: Host=postgres;Port=5432;Database=lt2;Username=lt2_worker;GSS Encryption Mode=Disable
      Email__Smtp__Host: ${LT2_SMTP_HOST:-mailpit}
      Email__Smtp__Port: ${LT2_SMTP_PORT:-1025}
      Email__Smtp__Security: ${LT2_SMTP_SECURITY:-None}
      Email__Smtp__UserName: ${LT2_SMTP_USERNAME:-}
      Email__Smtp__FromAddress: ${LT2_MAIL_FROM:-prisijungimas@lt2.localhost}
      # MP mail's own stream (design 8.19.3): its sender address and, when LT2_MP_SMTP_HOST is set, its own SMTP account
      # (password in secrets/mp_smtp_password); otherwise the common account above. Trouble there cannot block sign-in codes.
      Email__Mp__FromAddress: ${LT2_MAIL_FROM_MP:-suvestines@lt2.localhost}
      Email__Mp__Smtp__Host: ${LT2_MP_SMTP_HOST:-}
      Email__Mp__Smtp__Port: ${LT2_MP_SMTP_PORT:-587}
      Email__Mp__Smtp__Security: ${LT2_MP_SMTP_SECURITY:-StartTls}
      Email__Mp__Smtp__UserName: ${LT2_MP_SMTP_USERNAME:-}
      # Design 8.19.1, as for the web: invented data sends MP mail only where all mail is caught.
      Demo__Allowed: ${LT2_DEMO_DATA:-false}
      Email__Caught: ${LT2_MAIL_CAUGHT:-false}
      # The site's own address: links in the emails the worker sends start with it (design 5.6).
      Site__Address: https://${LT2_SITE_ADDRESS:-lt2.localhost}:${LT2_HTTPS_PORT:-8443}
      # The Seimas open data. Production keeps the default; only the local .env points the worker at the stand-in.
      Seimas__BaseAddress: ${LT2_SEIMAS_BASE_ADDRESS:-https://apps.lrs.lt/sip/}
      Outbound__AllowedHosts__1: ${LT2_OUTBOUND_EXTRA_HOST:-}
      # The upcoming plenary agenda (lrs.lt pages). Empty: the watcher is off. The host must be on the allowlist.
      Agenda__BaseAddress: ${LT2_AGENDA_BASE_ADDRESS:-}
      # Where at most one notice a day of new feedback goes (design 8.10); none when empty.
      Feedback__TeamAddress: ${LT2_FEEDBACK_TEAM_ADDRESS:-}
      # The follow emails' schedule (design 8.11.2). Empty: every 15 minutes. Only the local .env sets it (every minute), so
      # an end-to-end run does not wait a quarter of an hour for the email.
      Jobs__FollowsCron: ${LT2_FOLLOWS_CRON:-}
      # The AI summaries of bills (design 8.13), the same switch as the web's draft: "claude" with a key in
      # deploy/secrets/ai_api_key turns the provider on; empty (the default) keeps it off. Its host then joins the worker's
      # allowlist. The job also needs a reader of the bills' official texts, which does not exist yet.
      Ai__Provider: ${LT2_AI_PROVIDER:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    secrets:
      - source: db_worker_password
        target: Database__Password
      - source: smtp_password
        target: Email__Smtp__Password
      - source: mp_smtp_password
        target: Email__Mp__Smtp__Password
      - source: mail_hash_key
        target: Security__MailHashKey
      - source: ai_api_key
        target: Ai__ApiKey
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks: [backend]

  migrator:
    <<: *dotnet-hardening
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: migrator
    image: lt2/migrator:${LT2_IMAGE_TAG:-local}
    restart: "no"
    command: ${LT2_MIGRATOR_ARGS:-}
    environment:
      ConnectionStrings__Admin: Host=postgres;Port=5432;Database=lt2;Username=postgres;GSS Encryption Mode=Disable
      ConnectionStrings__Lt2: Host=postgres;Port=5432;Database=lt2;Username=lt2_migrator;GSS Encryption Mode=Disable
      # Local only: --demo-appeal may write invented participants (it also refuses unless the parliament data is the
      # stand-in's). Production leaves LT2_DEMO_DATA unset.
      Demo__Allowed: ${LT2_DEMO_DATA:-false}
    secrets:
      - source: postgres_password
        target: Database__AdminPassword
      - source: db_migrator_password
        target: Database__Password
      - source: db_app_password
        target: Database__AppPassword
      - source: db_worker_password
        target: Database__WorkerPassword
      - source: db_readonly_password
        target: Database__ReadonlyPassword
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  postgres:
    image: postgres:17
    restart: unless-stopped
    # The connection budget (design 9.5): 150 connections, 3 of them kept for superusers. The pools are set in each
    # host's appsettings.json: web 25 per instance (up to four at once during a deploy), worker 10, Hangfire 10,
    # migrator 5; together 125, leaving room for psql and backups. tests/Lt2.ArchitectureTests/ConnectionBudgetTests.cs
    # checks the sum.
    command: ["postgres", "-c", "max_connections=150", "-c", "superuser_reserved_connections=3"]
    environment:
      POSTGRES_DB: lt2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lt2"]
      interval: 3s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    networks: [backend]

  # Local only: catches every email; web UI and API on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: [local]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LT2_MAILPIT_PORT:-8025}:8025"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks: [backend]

  # Local only: a stand-in for the Seimas open-data service with INVENTED answers (the real one is closed for
  # maintenance until 2026-11-16). Profile "local" only, built from tools/ and never by deploy/Dockerfile;
  # tests/Lt2.ArchitectureTests/StandInIsolationTests.cs keeps it that way.
  seimas-standin:
    build:
      context: ..
      dockerfile: tools/Lt2.SeimasStandIn/Dockerfile
    image: lt2/seimas-standin:${LT2_IMAGE_TAG:-local}
    profiles: [local]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [backend]

networks:
  edge:
  backend:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

secrets:
  postgres_password:
    file: ${LT2_SECRETS_DIR:-./secrets}/postgres_password
  db_migrator_password:
    file: ${LT2_SECRETS_DIR:-./secrets}/db_migrator_password
  db_app_password:
    file: ${LT2_SECRETS_DIR:-./secrets}/db_app_password
  db_worker_password:
    file: ${LT2_SECRETS_DIR:-./secrets}/db_worker_password
  db_readonly_password:
    file: ${LT2_SECRETS_DIR:-./secrets}/db_readonly_password
  data_protection_key:
    file: ${LT2_SECRETS_DIR:-./secrets}/data_protection_key
  ip_hash_key:
    file: ${LT2_SECRETS_DIR:-./secrets}/ip_hash_key
  smtp_password:
    file: ${LT2_SECRETS_DIR:-./secrets}/smtp_password
  mp_smtp_password:
    file: ${LT2_SECRETS_DIR:-./secrets}/mp_smtp_password
  mail_hash_key:
    file: ${LT2_SECRETS_DIR:-./secrets}/mail_hash_key
  device_hash_key:
    file: ${LT2_SECRETS_DIR:-./secrets}/device_hash_key
  ai_api_key:
    file: ${LT2_SECRETS_DIR:-./secrets}/ai_api_key
