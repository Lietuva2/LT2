# Lietuva 2.0 behind a server's existing Caddy (design 9.2, the trial on the owner's VPS). Added to compose.yaml:
#
#   docker compose --env-file <server env file> -f deploy/compose.yaml -f deploy/compose.shared-proxy.yaml up -d
#
# That Caddy holds ports 80 and 443 and the certificates. LT2's own Caddy does not start and nothing here publishes 80
# or 443; `web` also joins that Caddy's Docker network (LT2_PROXY_NETWORK, created by the other project) under the alias
# lt2-web, which the site block in shared-proxy.Caddyfile proxies to, and believes forwarded client addresses only from that
# Caddy (LT2_PROXY_HOST). README.md, "Behind a server's existing Caddy".
#
# Mailpit (profile "local", a trial with caught emails) joins the same network as lt2-mailpit for the optional mail
# viewer block, and asks for a name and password itself, from the password file mailpit_ui_auth in the secrets
# directory (htpasswd lines, bcrypt), on every route to it, the server's loopback port included. Whoever reads it reads
# every sign-in code (design 9.2). Locally, without this file, Mailpit stays open for the end-to-end tests.

services:
  caddy:
    # A profile nobody enables: the service never starts with the stack. Started by name, it publishes nothing.
    profiles: [own-proxy]
    ports: !reset []

  web:
    environment:
      # Design 6.8: the forwarding headers are believed only from the server's Caddy, named as Docker's DNS knows it on
      # LT2_PROXY_NETWORK (its container name or an alias), not from the other containers on that shared network.
      ReverseProxy__Address: ${LT2_PROXY_HOST:?set LT2_PROXY_HOST to the name of the server's Caddy on LT2_PROXY_NETWORK}
    networks:
      shared-proxy:
        # "web" is too generic a name on a network other projects share.
        aliases: [lt2-web]

  mailpit:
    environment:
      MP_UI_AUTH_FILE: /run/secrets/mailpit_ui_auth
    secrets:
      - mailpit_ui_auth
    networks:
      shared-proxy:
        aliases: [lt2-mailpit]

networks:
  shared-proxy:
    name: ${LT2_PROXY_NETWORK:?set LT2_PROXY_NETWORK to the Docker network of the server's Caddy}
    external: true

secrets:
  mailpit_ui_auth:
    file: ${LT2_SECRETS_DIR:-./secrets}/mailpit_ui_auth
